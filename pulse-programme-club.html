<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours Programme Club</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout Pulse : barre haute, menu à gauche, écran central (Ma journée = brief / Analyse approfondie = deep dive), panneau Talk to my Data à droite */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F3F4F7; --ink:#0E1726; --ink-2:#3A4556; --muted:#5B6474; --line:#E4E7EC;
  --accent:#2348C9; --accent-ink:#FFFFFF; --accent-soft:#EAF0FF; --accent-deep:#1A3699;
  --brief:var(--accent-soft); --brief-ink:var(--ink); --brief-muted:var(--accent); --brief-tile:var(--surface);
  --alert:#B4530A; --alert-soft:#FFF1E6; --vig:#A16207; --vig-soft:#FEF6DD; --ok:#0F766E; --ok-soft:#E3F5F1; --opp:#2348C9; --opp-soft:#EAF0FF;
  --neg:#E0915A; --pos:#2348C9; --ia:#6D28D9; --ia-soft:#F1EBFE;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 8px 24px rgba(14,23,38,.06);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F19; --surface:#131A28; --surface-2:#1A2233; --ink:#E7ECF5; --ink-2:#C3CBD9; --muted:#97A2B6; --line:#263044;
  --accent:#86A2FF; --accent-ink:#0B0F19; --accent-soft:#1B2650; --accent-deep:#A9BDFF;
  --brief:var(--accent-soft); --brief-ink:var(--ink); --brief-muted:var(--accent-deep); --brief-tile:var(--surface);
  --alert:#F5A469; --alert-soft:#3A2416; --vig:#F2C453; --vig-soft:#352B12; --ok:#5ED3C0; --ok-soft:#12302C; --opp:#86A2FF; --opp-soft:#1B2650;
  --neg:#E59A66; --pos:#86A2FF; --ia:#B794FF; --ia-soft:#2A1F45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F19; --surface:#131A28; --surface-2:#1A2233; --ink:#E7ECF5; --ink-2:#C3CBD9; --muted:#97A2B6; --line:#263044;
  --accent:#86A2FF; --accent-ink:#0B0F19; --accent-soft:#1B2650; --accent-deep:#A9BDFF;
  --brief:var(--accent-soft); --brief-ink:var(--ink); --brief-muted:var(--accent-deep); --brief-tile:var(--surface);
  --alert:#F5A469; --alert-soft:#3A2416; --vig:#F2C453; --vig-soft:#352B12; --ok:#5ED3C0; --ok-soft:#12302C; --opp:#86A2FF; --opp-soft:#1B2650;
  --neg:#E59A66; --pos:#86A2FF; --ia:#B794FF; --ia-soft:#2A1F45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* Barre haute */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);height:68px;display:flex;align-items:center;gap:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 12px;white-space:nowrap}
.chip.src{background:var(--accent-soft);color:var(--accent)}
.chip.real{background:var(--ok-soft);color:var(--ok)}
.chip.prof{color:var(--muted)}
.chip.prof b{color:var(--ink)}
.bell{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}

/* Coque */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100% - 68px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}
.nav{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px}
.nav .badge.n{background:var(--alert-soft);color:var(--alert)}
.nav .badge.ia{background:var(--accent-soft);color:var(--accent)}
.nav .badge.t{color:var(--muted);font-weight:500}
.nav.muted{color:var(--muted)}
.side .grp{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:16px 12px 4px}
.perim{margin-top:auto;border-top:1px solid var(--line);padding:14px 12px 0;font-size:12px;color:var(--muted)}
.perim b{display:block;color:var(--ink);font-size:13px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;min-width:0}
.main{padding:28px max(24px,env(safe-area-inset-right,0px)) 48px 40px;min-width:0}
.main-in{max-width:1120px;margin:0 auto}

/* Ma journée (brief) */
.greet{font-size:13.5px;color:var(--muted);font-weight:500}
.head-row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.h1{font-size:clamp(24px,2.6vw,31px);font-weight:700;letter-spacing:-.01em;margin-top:4px;max-width:34ch}
.byline{font-size:12.5px;color:var(--muted);margin-top:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.briefcard{background:var(--brief);color:var(--brief-ink);border-radius:18px;padding:26px 26px 22px;margin-top:22px}
.briefcard .eb{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--brief-muted)}
.pts{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.pt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:start;font-size:16px;line-height:1.55}
.pt .k{width:28px;height:28px;border-radius:8px;background:var(--brief-tile);display:grid;place-items:center;font-size:13px;font-weight:700}
.pt b{font-weight:700}
.minis{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.mini{background:var(--brief-tile);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:132px;text-align:left;color:inherit}
.mini:hover{border-color:var(--accent)}
.mini .l{font-size:11.5px;color:var(--brief-muted)}
.mini .v{font-size:16px;font-weight:700}
.mini .v small{font-size:12px;font-weight:700;margin-left:4px}
.mini .v small.n{color:var(--neg)} .mini .v small.p{color:var(--accent)}
.briefcard .foot{font-size:12px;color:var(--brief-muted);margin-top:14px}
.domains{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-top:16px}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.dom:hover{border-color:var(--accent)}
.dom b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dom span{font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.alert{background:var(--alert)} .dot.vig{background:var(--vig)} .dot.ok{background:var(--ok)} .dot.opp{background:var(--opp)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:24px;align-items:start}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:19px;font-weight:700}
.sec-h p{font-size:12.5px;color:var(--muted)}
.signal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.sig-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:3px 9px}
.tag.alert{background:var(--alert-soft);color:var(--alert)} .tag.vig{background:var(--vig-soft);color:var(--vig)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.opp{background:var(--opp-soft);color:var(--opp)}
.tag.dom2{border:1px solid var(--line);font-weight:600;color:var(--ink-2)}
.impact{margin-left:auto;font-size:13.5px;font-weight:700;color:var(--alert)}
.impact.p{color:var(--accent)}
.signal h3{font-size:17px;font-weight:700}
.signal p{font-size:14.5px;color:var(--ink-2)}
.sig-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conf{margin-left:auto;font-size:12px;color:var(--muted)}
.aside{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 6px;position:sticky;top:84px}
.aside .eb{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--accent)}
.aside .sub{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.vline{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.vline .dot{margin-top:6px}
.vline b{display:block;font-size:13px}
.vline span{color:var(--muted);font-size:12.5px;line-height:1.4;display:block}

/* Analyse approfondie (deep dive) */
.back{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;padding:0;margin-bottom:8px}
.crumb{font-size:13.5px;color:var(--muted)}
.toc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 18px}
.toc .l{font-size:13px;color:var(--muted);font-weight:600;margin-right:4px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.toc button:hover{border-color:var(--accent);color:var(--accent)}
.asec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:16px;scroll-margin-top:84px}
.asec-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.asec .eb{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.asec h2{font-size:21px;font-weight:700;margin-top:4px}
.ask-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.ask-btn:hover{border-color:var(--ia);color:var(--ia)}
.prose{margin-top:14px;display:flex;flex-direction:column;gap:12px;font-size:15.5px;line-height:1.75;color:var(--ink-2);max-width:78ch}
.prose b{color:var(--ink);font-weight:700}
.gtoggle{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:18px;padding-top:12px;flex-wrap:wrap}
.gbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center;padding:6px 8px}
.gwrap{margin-top:10px}
.gcap{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:520px;max-width:780px}
.chart svg text{font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px}
.src{font-size:12px;color:var(--muted);margin-top:6px}
.hyp{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.hyps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hyp-h{display:flex;gap:10px;align-items:center}
.hyp-h b{font-size:15px}
.hyp-h .imp{margin-left:auto;font-weight:700;font-size:14px;color:var(--alert);white-space:nowrap}
.hyp-h .imp.p{color:var(--accent)} .hyp-h .imp.z{color:var(--muted)}
.hyp p{font-size:14px;color:var(--ink-2)}
.hyp .s{font-size:12px;color:var(--muted)}
.st{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.st.c{background:var(--accent-soft);color:var(--accent)} .st.pa{background:var(--vig-soft);color:var(--vig)} .st.r{background:var(--surface-2);color:var(--muted)} .st.v{background:var(--ia-soft);color:var(--ia)}
.hyp.rej{opacity:.75}
.reco{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px}
.reco .k{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px}
.reco b{font-size:15.5px}
.reco p{font-size:14px;color:var(--ink-2);margin-top:4px}
.reco .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px;align-items:center}
.reco .meta b{font-size:12.5px;color:var(--ink)}
.reco .meta .btn{margin-left:auto}
.method{background:var(--surface-2);border-radius:14px;padding:16px 18px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.method b{color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.t .r{text-align:right}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap}
.pill.up{background:var(--accent-soft);color:var(--accent)} .pill.down{background:var(--alert-soft);color:var(--alert)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* Talk to my Data */
.ttmd{width:400px;background:var(--surface);border-left:1px solid var(--line);position:sticky;top:68px;height:calc(100vh - 68px);display:flex;flex-direction:column}
.ttmd[hidden]{display:none!important}
.tt-h{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:36px minmax(0,1fr) 28px;gap:12px;align-items:start}
.tt-h .lg{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tt-h b{font-size:16px}
.tt-h p{font-size:12.5px;color:var(--muted)}
.tt-h .x{border:0;background:transparent;font-size:20px;color:var(--muted);line-height:1}
.ctx{grid-column:1 / -1;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px;justify-self:start}
.tt-body{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg-u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:14px;max-width:90%}
.steps{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.steps .eb{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--muted)}
.steps .s0{color:var(--muted)} .steps .s1{color:var(--ink);font-weight:600} .steps .s2{color:var(--ink)}
.msg-a{background:var(--surface-2);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14px;line-height:1.6}
.msg-a b{font-weight:700}
.msg-a .srcs{margin-top:8px;font-size:11.5px;color:var(--muted)}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg .eb{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--muted)}
.sugg button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px}
.sugg button:hover{border-color:var(--accent)}
.tt-in{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px}
.tt-in input{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;min-width:0}
.tt-note{font-size:11.5px;color:var(--muted);padding:0 18px 12px}

.view[hidden]{display:none!important}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}

@media (max-width:1280px){.domains{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1200px){
  .ttmd{position:fixed;right:0;top:68px;z-index:45;box-shadow:var(--shadow);width:min(400px,100%);padding-right:env(safe-area-inset-right,0px)}
  .cols{grid-template-columns:minmax(0,1fr)}
  .aside{position:static}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left,0px))}
  .side .grp,.perim,.side .hide-sm{display:none}
  .nav{width:auto;white-space:nowrap}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .chip.prof,.chip.src{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .domains{grid-template-columns:repeat(2,minmax(0,1fr))}
  .asec{padding:20px 18px}
  .asec-h{flex-direction:column}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand span{display:none}
}

/* Ajouts v4 : graphiques visibles, dashboard régalien intégré */
.figs{display:flex;flex-direction:column;gap:18px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.fig{display:flex;flex-direction:column;gap:6px;min-width:0}
.fig-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fig-h h3{font-size:14.5px;font-weight:700}
.fig-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ===================== PILOTAGE : valeur en jeu, dynamique, priorités (règles fixes, à partir des KPI) ===================== */
function pilot(){const {k,fs,dts,ref}=M,P={};
  const caTot=(k.ca_e||0)+(k.ca_ne||0),dbTot=(k.debit_e||0)+(k.debit_ne||0);P.caTot=caTot;P.dbTot=dbTot;
  P.pt=caTot?caTot*0.01:null;                                              // valeur d'un point de poids CA
  P.gapCAeur=A.gapCA!=null&&caTot?-A.gapCA*caTot:null;                     // > 0 : CA encarté manquant pour l'objectif
  P.gapDbPass=A.gapDebit!=null&&dbTot?-A.gapDebit*dbTot:null;              // > 0 : passages encartés manquants
  P.caGain=k.ca_gagnes;P.caLost=k.ca_perdus!=null?Math.abs(k.ca_perdus):null;P.caNet=P.caGain!=null&&P.caLost!=null?P.caGain-P.caLost:null;
  P.lost=k.foyers_perdus!=null?Math.abs(k.foyers_perdus):null;P.won=k.foyers_gagnes;
  P.recNeed=P.lost!=null&&P.won!=null?P.lost-P.won:null;
  P.retention=k.foyers_n1&&P.lost!=null?1-P.lost/k.foyers_n1:null;
  P.valLost=P.lost&&P.caLost?P.caLost/P.lost:null;                         // CA moyen d'un foyer perdu
  const b=A.actBest;P.simAct=b&&ref&&ref.clients&&b.depense>ref.depense?{n:ref.clients*0.01,v:ref.clients*0.01*(b.depense-ref.depense),name:b.name,ref:ref.name}:null;
  P.simPanier=k.clients_e&&k.freq_e?k.clients_e*k.freq_e:null;             // CA d'1 € de panier en plus par visite encartée
  P.simFreq=k.clients_e&&k.panier_e?k.clients_e*0.1*k.panier_e:null;      // CA de +0,1 visite par encarté
  /* dynamique récente : historique des périodes */
  let H=null;try{H=TB?histFromTables():(RAW?buildHist():null);}catch(e){H=null;}P.H=H;
  const G=H&&H.rows?H.rows.map(r=>r.fmt.Groupe||{}):[],L=G.length;
  if(L>=2){const a=G[L-1],p=G[L-2],d=(x,y)=>x!=null&&y!=null?x-y:null;
    P.mom={prev:H.rows[L-2].label,dCA:d(a.poids_ca,p.poids_ca),dDb:d(a.poids_db,p.poids_db),dEv:d(a.ev_ca_e,p.ev_ca_e),evCA:a.ev_ca_e,dFreq:d(H.rows[L-1].ev_freq,H.rows[L-2].ev_freq),dPan:d(H.rows[L-1].ev_panier,H.rows[L-2].ev_panier)};
    const w=Math.min(4,L-1);P.mom.w=w;P.mom.trDb=d(a.poids_db,G[L-1-w].poids_db);P.mom.trCA=d(a.poids_ca,G[L-1-w].poids_ca);
    const gaps=G.map(g=>g.obj_db!=null&&g.poids_db!=null?g.poids_db-g.obj_db:null).filter(v=>v!=null);P.mom.under=gaps.filter(v=>v<0).length;P.mom.nGap=gaps.length;
    let run=0;for(let i=gaps.length-1;i>=0&&gaps[i]<0;i--)run++;P.mom.runUnder=run;}
  /* priorités par format : écart objectif, recrutement, croissance vs non-encartés */
  P.fmt=fs.map(f=>{const gap=f.poids_debit_obj!=null?f.poids_debit-f.poids_debit_obj:null;const why=[];
    if(gap!=null&&gap<0)why.push(`${pts(gap)} vs objectif`);if(f.ev_rec<-0.02)why.push(`recrutement ${evo(f.ev_rec)}`);if(f.ev_ca_e!=null&&f.ev_ca_ne!=null&&f.ev_ca_e<f.ev_ca_ne)why.push('encartés moins dynamiques que les non-encartés');
    const sc=(gap!=null&&gap<0?2:0)+(f.ev_rec<-0.02?1:0)+(f.ev_ca_e<f.ev_ca_ne?1:0);
    return {name:f.name,poids:f.poids_debit,gap,evCA:f.ev_ca_e,evNE:f.ev_ca_ne,evRec:f.ev_rec,sc,why,lv:sc>=3?'alert':sc>=1?'vig':'ok'};}).sort((a,b)=>b.sc-a.sc||(a.gap??0)-(b.gap??0));
  P.dt=[...dts].filter(d=>d.dobj!=null).sort((a,b)=>a.dobj-b.dobj).slice(0,5);
  /* 5 piliers du programme */
  const st=(c,v)=>c?'alert':v?'vig':'ok';

/* repli si la librairie Excel ne charge pas : un CSV unique, sections séparées */
function expCsvAll(){try{const d=xlData(),L=[];const q=v=>v==null||(typeof v==='number'&&!isFinite(v))?'':typeof v==='number'?String(v).replace('.',','):`"${String(v).replace(/"/g,'""')}"`;
  const sec=(t,rows)=>{if(!rows.length)return;const ks=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!XL_SKIP.has(k)&&!ks.includes(k)&&rows.some(x=>x[k]!=null))ks.push(k);}));L.push(q(t),ks.map(k=>q(XL_COL[k]||k)).join(';'),...rows.map(r=>ks.map(k=>q(r[k])).join(';')),'');};
  L.push(q(`Pulse Programme Club · ${M.label} · ${FILT.enc} · ${FILT.nc} · ${FILT.stat}`),'');
  sec('FORMATS',d.cur);sec('HISTORIQUE',d.hist);sec('TERRITOIRES',d.ter);['SEGMENT','SOLDE','VALEUR','CANAL','MIXITE','MATRICE'].forEach(b=>sec(b,d.cli(b)));
  dl(expName('csv'),'﻿'+L.join('\r\n'),'text/csv;charset=utf-8')?toast('Excel indisponible : chiffres téléchargés en .csv (sections séparées).'):toast('Téléchargement bloqué par le navigateur.');}catch(e){console.warn(e);toast('Export impossible.');}}

function hyps(){const {k}=M,H=[];

  H.push([recConf?'c':'r',recConf?'Confirmée':'Rejetée','Le recrutement ne compense plus le renouvellement',`${evo(k.ev_recrues)} de recrues`,`Recrutement ${evo(k.ev_recrues)} (${M.fs.map(f=>`${f.name} ${evo(f.ev_rec)}`).join(', ')}). ${A.churn!=null?`${nf(A.churn*100,0)} % des foyers N-1 sont perdus sur la période ; `:''}solde de ${S(A.solde)}${cnt(Math.abs(A.solde))} foyers.`,'KPI Recrues · Solde d’actifs']);
  if(A.carte&&A.app){const c=A.carte.dg<0&&A.app.dg>0;H.push([c?'c':'pa',c?'Confirmée':'Partielle','L’adhésion bascule de la carte physique vers le digital',`cartes ${pts(A.carte.dg)}`,`Cartes ${pct(A.carte.part_groupe,1)} (${pts(A.carte.dg)}), App ${pct(A.app.part_groupe,1)} (${pts(A.app.dg)}). En ${M.focus} : cartes ${pct(A.carte.part_focus,1)} (${pts(A.carte.df)}).`,'KPI Canal d’adhésion']);}
  if(A.mixWorst){const c=A.mixD<0;H.push([c?'c':'r',c?'Confirmée':'Rejetée',`La structure du trafic joue contre le programme (${A.mixWorst.name})`,`${pts(A.mixD,2)} d’effet mix`,`Effet format ${pts(A.fmtD,2)}, effet mix ${pts(A.mixD,2)}. ${A.mixWorst.name} : Débit non encarté ${evo(A.mixWorst.ev_debit_ne)}, encarté ${evo(A.mixWorst.ev_debit_e)}, poids ${pct(A.mixWorst.poids_debit)}.`,'KPI Effet format · Effet mix']);}
  {const w=A.segWorst,c=w.ev<-0.03;H.push([c?'pa':'r',c?'Partielle':'Rejetée',`Les ${w.name.toLowerCase()} se détournent`,`${evo(w.ev)}`,`Effet clients ${evo(w.effet_clients)}, effet fréquence ${evo(w.effet_freq)}. Lecture ${M.per}.`,'KPI CA par segment']);}
  if(A.prixE&&A.artE){const c=Math.abs(A.prixE.v)>Math.abs(A.artE.v)*0.5;H.push([c?'c':'r',c?'Confirmée':'Rejetée','Un effet prix',dmeur(A.prixE.v),`Le prix moyen évolue de ${evo(k.ev_prix_e)} (${dmeur(A.prixE.v)}), contre ${dmeur(A.artE.v)} pour le nombre d’articles.`,'KPI Équation commerciale']);}
  {const c=k.ev_ca_e<k.ev_ca_ne;H.push([c?'c':'r',c?'Confirmée':'Rejetée','Une désaffection pour le programme',`CA encartés ${evo(k.ev_ca_e)}`,`CA encartés ${evo(k.ev_ca_e)} contre ${evo(k.ev_ca_ne)} pour les non-encartés. ${A.actBest?`${A.actBest.name} : dépense ${evo(A.actBest.evd)}.`:''}`,'KPI Équation commerciale · Valeur client']);}
  const order={c:0,pa:1,r:2};return H.sort((a,b)=>order[a[0]]-order[b[0]]);}
function recos(){const {k}=M,R=[],P=A.P||{};

  if(!R.length)R.push(['Maintenir la dynamique','Aucun indicateur sous son seuil d’alerte : sécuriser les leviers actuels et suivre la fréquence.','Marketing fidélité','4 semaines','Indicateurs stables','Créer une alerte','']);
  return R;}

      <tr><td>Encarté</td>${M.formats.map(f=>`<td class="r num">${mes==='CA'?meur(f.ca_e):vol(f.debit_e)} ${pill(mes==='CA'?f.ev_ca_e:f.ev_debit_e)}</td>`).join('')}</tr>

      <div class="panel">${figHtml('poids',{noRg:true})}</div><div class="panel">${figHtml('mix',{noRg:true})}</div>`;}
  if(rgPage==='format'){const F=A.F;return `

      ${panelT('Flop magasins (écart vs objectif)',`<table class="t">${thead(['Magasin','Poids','vs N-1','vs obj'])}<tbody>${A.magPFlop.map(m=>`<tr><td>${esc(m.name)}</td><td class="r num">${pct(m.poids_debit,1)}</td><td class="r">${pill(m.dn1,'pts')}</td><td class="r">${pill(m.dobj,'pts')}</td></tr>`).join('')}</tbody></table>`)}</div>`;}
  if(rgPage==='eqc')return `<div class="two">

      <div class="panel"><h3 style="font-size:14.5px">Non encartés</h3><div class="kgrid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:4px">${tile('CA',meur(k.ca_ne),tc(k.ev_ca_ne,evo(k.ev_ca_ne)),'eqc')+tile('Débit',vol(k.debit_ne),tc(k.ev_debit_ne,evo(k.ev_debit_ne)),'eqc')+tile('Panier moyen',eur(k.panier_ne),tc(k.ev_panier_ne,evo(k.ev_panier_ne)),'eqc')+tile('Articles / panier',dec(k.articles_ne),tc(k.ev_articles_ne,evo(k.ev_articles_ne)),'eqc')+tile('Prix moyen',eur(k.prix_ne),tc(k.ev_prix_ne,evo(k.ev_prix_ne)),'eqc')}</div></div></div>
    <div class="panel">${figHtml('wf',{noRg:true})}</div>`;
  if(rgPage==='segment')return `<div class="kgrid">${tile(`CA encartés · ${M.perS}`,meur(k.seg_ca),tc(k.ev_seg_ca,evo(k.ev_seg_ca)),'seg')+tile(`Clients · ${M.perS}`,cnt(k.seg_clients),nt(M.perS),'seg')+tile('Dépense moyenne',eur(k.seg_depense),nt(M.perS),'seg')+tile('Panier moyen',eur(k.seg_panier),nt(M.perS),'seg')}</div>
    <div class="panel">${figHtml('seg',{noRg:true})}</div>
    ${panelT(`Équation commerciale par segment · ${M.per}`,`<table class="t">${thead(['Segment','Clients','Poids CA','Évol. CA','Effet clients','Effet fréq.','Effet panier'])}<tbody>${M.segs.map(g=>`<tr><td>${esc(g.name)}</td><td class="r num">${cnt(g.clients)}</td><td class="r num">${pct(g.poids,1)}</td><td class="r">${pill(g.ev)}</td><td class="r">${pill(g.effet_clients)}</td><td class="r">${pill(g.effet_freq)}</td><td class="r">${pill(g.effet_panier)}</td></tr>`).join('')}</tbody></table>`)}`;
  if(rgPage==='solde'){const cs=[['CA','cst_ca',meur],['Dépense moyenne','cst_depense',eur],['Fréquence','cst_freq',dec],['Panier moyen','cst_panier',eur],['Articles / panier','cst_articles',v=>dec(v,2)],['Prix moyen','cst_prix',eur]];
    return `<div class="kgrid">${tile('Foyers actifs',cnt(k.foyers_n),tc(A.solde,S(A.solde)+cnt(Math.abs(A.solde))+' vs N-1'),'base')+tile('Gagnés',cnt(k.foyers_gagnes),tc(1,dmeur(k.ca_gagnes)+' de CA'),'base')+tile('CA des constants',meur(k.cst_ca_n),tc(k.ca_constants,evo(ev(k.cst_ca_n,k.cst_ca_n1))+' · '+dmeur(k.ca_constants)),'base')+tile('Perdus',cnt(k.foyers_perdus),tc(-1,dmeur(k.ca_perdus)+' de CA'),'base')}</div>

  if(rgPage==='recrutement'&&FILT.tempo==='CAM')return panelT('Recrutement','<p class="sub">Le recrutement n’est pas suivi en CAM. Choisissez Hebdo, Mensuel ou CAD.</p>');
  if(rgPage==='recrutement')return `<div class="kgrid" style="grid-template-columns:repeat(${M.formats.length},minmax(0,1fr))">${M.formats.map(f=>tile('Recrues · '+f.name,cnt(f.recrues),tc(f.ev_rec,evo(f.ev_rec)),'rec')).join('')}</div>
    <div class="panel">${figHtml('rec',{noRg:true})}</div>

      ${panelT(`Flop magasins · ${M.focus}`,`<table class="t">${thead(['Magasin','N','N-1','Évol.'])}<tbody>${A.magRFlop.map(m=>`<tr><td>${esc(m.name)}</td><td class="r num">${cnt(m.recrues)}</td><td class="r num">${cnt(m.recrues_n1)}</td><td class="r">${pill(m.ev)}</td></tr>`).join('')}</tbody></table>`)}</div>`;

    <div class="panel">${figHtml('mixite',{noRg:true})}</div>

function renderRG(){

      <div class="btns"><button type="button" class="btn" data-go="brief">${icon('sun')}Lire le brief</button><button type="button" class="btn primary" data-go="deep">${icon('trend')}Analyse approfondie</button></div></div>
    <div class="rgwrap"><nav class="rgnav" aria-label="Pages du dashboard">${RG_PAGES.map(([g,items])=>`<div class="rgg">${g}</div>${items.map(([kk,l])=>`<button type="button" data-page="${kk}" aria-current="${kk===rgPage?'page':'false'}">${l}</button>`).join('')}`).join('')}</nav>
      <div class="rgcontent fade"><p class="rgdesc">${RG_DESC[rgPage]}</p>${rgFilters()}${rgPageBody()}</div></div>`;
  $('#v-rg').querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{rgPage=b.dataset.page;renderRG();}));
  const fm=$('#fMes');if(fm)fm.addEventListener('change',e=>{rgMes=e.target.value;renderRG();});
  bindCommon($('#v-rg'),'Dashboard régalien · '+RG_TITLES[rgPage]);drawFigs($('#v-rg'),rgMes);
}

/* --- pilotage des paramètres et filtres Tableau --- */
let PAR=null;const DONE={};
const avs=p=>((p&&p.allowableValues&&p.allowableValues.allowableValues)||[]);
async function loadParams(){const ps=await SRC.getParametersAsync();PAR={};ps.forEach(p=>{PAR[p.name.trim()]=p;DONE[p.name.trim()]=String(p.currentValue&&p.currentValue.value);});}
async function setPv(name,hit){const p=PAR[name];if(!p||!hit)return;if(DONE[name]===String(hit.value))return;
  try{await p.changeValueAsync(typedVal(p,hit.value));}catch(e){console.warn('[Pulse] paramètre',name,e);return;}DONE[name]=String(hit.value);}
// Tableau attend une valeur du type du paramètre (entier, texte…) : une chaîne sur un paramètre entier déclenche une erreur
function typedVal(p,v){const t=String(p&&p.dataType||'').toLowerCase();if(/int|float|real|number/.test(t)){const n=Number(v);return isFinite(n)?n:v;}if(/bool/.test(t))return v===true||String(v)==='true';return v==null?v:String(v);}
const setP=(name,pred)=>setPv(name,avs(PAR[name]).find(x=>pred(nrm(x.formattedValue??x.value))));
const setPi=(name,i)=>setPv(name,avs(PAR[name])[i]);
const fmtRe={Groupe:/groupe/,Hyper:/hyper/,Market:/market/,Proxi:/proxi/,'E-commerce':/e-?com/};
const TEMPO_PAR={Hebdo:/^p_semaine/i,Mensuel:/^p_mois/i,CAD:/^p_cad/i,CAM:/^p_cam/i};
function loadPeriods(){const re=TEMPO_PAR[FILT.tempo],want=FILT.tempo==='Mensuel'?'M':'S',keys=new Set();
  Object.keys(PAR).filter(n=>re.test(n)).forEach(n=>avs(PAR[n]).forEach(x=>{const k=perKey(x.formattedValue??x.value);if(k&&k[4]===want)keys.add(k);}));
  PERIODS=[...keys].sort().reverse().map(k=>({v:k,l:perLab(k,FILT.tempo)}));if(!PERIODS.some(p=>p.v===FILT.per))FILT.per=PERIODS.length?PERIODS[0].v:'';}
function initFiltFromTableau(){const cur=n=>PAR[n]?nrm(PAR[n].currentValue.formattedValue??PAR[n].currentValue.value):'';
  const t=cur('Temporalité');FILT.tempo=/hebdo/.test(t)?'Hebdo':/mens/.test(t)?'Mensuel':/cam/.test(t)?'CAM':'CAD';
  FILT.enc=/pass/.test(cur('p_flag_clients_detail'))?'PASS':'Encarté';
  const fe=cur('P_enseigne');FILT.focus=Object.keys(fmtRe).find(k=>k!=='Groupe'&&fmtRe[k].test(fe))||'Hyper';
  const fq=cur('P_enseigne EQC');FILT.eqc=Object.keys(fmtRe).find(k=>fmtRe[k].test(fq))||'Groupe';
  const ax=cur('DT/DR/Enseigne');FILT.axe=/region/.test(ax)?'Direction Régionale':/exploit/.test(ax)?'Mode d’exploitation':/operation/.test(ax)?'Direction Opération':'Direction Territoriale';
  const sg=cur('P segmentation');FILT.segm=CTRL.find(c=>c.k==='segm').o.find(o=>nrm(o)===sg)||'Structurelle';
  const bl=cur('Période balance');FILT.bal=CTRL.find(c=>c.k==='bal').o.find(o=>nrm(o)===bl)||'3 derniers mois';
  loadPeriods();}
async function setFilter(ws,fieldRe,pred){let fs;try{fs=await ws.getFiltersAsync();}catch(e){return;}
  const f=fs.find(x=>fieldRe.test(x.fieldName));if(!f||f.filterType&&String(f.filterType).toLowerCase()!=='categorical')return;
  let vals=null;for(const dt of ['database','relevant']){try{const d=await f.getDomainAsync(dt);if(d&&d.values&&d.values.length){vals=d.values;break;}}catch(e){}}
  vals=vals||f.appliedValues||[];const hit=vals.find(v=>pred(nrm(v.formattedValue??v.value)));if(!hit)return;
  const lab=String(hit.formattedValue??hit.value),cur=(f.appliedValues||[]).map(v=>String(v.formattedValue??v.value));if(!f.isExcludeMode&&cur.length===1&&cur[0]===lab)return;
  // Tableau attend la valeur affichée (alias) : on l'applique, puis on vérifie, sinon valeur brute
  for(const v of [lab,String(hit.value)]){try{await ws.applyFilterAsync(f.fieldName,[v],'replace',{isExcludeMode:false});const g=(await ws.getFiltersAsync()).find(x=>x.fieldName===f.fieldName);if(!g||(g.appliedValues||[]).length)return;}catch(e){console.warn('[Pulse] filtre',f.fieldName,ws.name,e);}}}
async function applyFilt(){const F=FILT,ti=['Hebdo','Mensuel','CAD','CAM'].indexOf(F.tempo);
  for(const n of ['Temporalité','Temporalité 1','Temporalité segment'])await setPi(n,ti);
  if(F.per){const re=TEMPO_PAR[F.tempo];for(const n of Object.keys(PAR).filter(n=>re.test(n)))await setPv(n,avs(PAR[n]).find(x=>perKey(x.formattedValue??x.value)===F.per));}
  const pass=F.enc==='PASS';for(const n of ['p_flag_clients_detail','Encarte/Pass','DZV Encarté/Pass','Client Eqc'])await setP(n,v=>pass?/pass/.test(v):!/pass/.test(v));
  const fi=['Hyper','Market','Proxi','E-commerce'].indexOf(F.focus);for(const n of ['P_enseigne','P_enseigne Recrutement'])await setP(n,v=>fmtRe[F.focus].test(v));void fi;
  await setP('P_enseigne EQC',v=>fmtRe[F.eqc].test(v));
  await setPi('DT/DR/Enseigne',CTRL.find(c=>c.k==='axe').o.indexOf(F.axe));
  await setP('P segmentation',v=>v===nrm(F.segm));await setP('Période balance',v=>v===nrm(F.bal));
  await setP('Cora',v=>F.nc==='Exclu'?/exclu/.test(v):/inclu/.test(v));
  const byName={};SRC.worksheets.forEach(w=>{byName[w.name.trim()]=w;});
  const ncP={Exclu:v=>/exclu/.test(v),Inclus:v=>/inclu/.test(v),'New Carrefour':v=>/new/.test(v)}[F.nc],stP=v=>v===nrm(F.stat);
  for(const n of ALL_SHEETS){const ws=byName[n];if(!ws)continue;await setFilter(ws,/flag.?cora/i,ncP);await setFilter(ws,/statut_desc/i,stP);}
  for(const n of ['EQC E','EQC Débit E','Waterfall EQC'])if(byName[n])await setFilter(byName[n],/^flag clients$/i,v=>v===nrm(pass?'PASS':'Encarté'));}
async function refreshTableau(){if(TB){refreshTables();return;}if(!PAR||BUSY)return;BUSY=true;loadPeriods();renderGbar();

/* ===================== HISTORIQUE : toutes les périodes, depuis les tables sources =====================
   Pulse lit les tables complètes des sources du dashboard (Encartage_Groupe, EQC) : toutes les périodes,
   toutes les temporalités, tous les formats. Les KPI se recalculent sans repasser par Tableau. */
let RAW=null,HIST=null;
const HCOLS={EG:['Identifiant','Temporalite','Enseigne','Flag clients','Flag cora','statut_desc','Vision','CA total N','CA total N1','Debit N','Debit N1','obj_PoidsCAEncarte','obj_PoidsDebitsEncartes'],
  EQ:['Identifiant','Temporalite','Enseigne','Flag clients','Flag cora','statut_desc','Vision','nb clients N','nb clients N1','Freq N','Freq N1','Panier Moyen N','Panier Moyen N1','Depense M N','Depense M N1','Prix moyen N','Prix moyen N1','Article moyen N','Article moyen N1','CA total N','CA total N1']};
async function readLogical(ds,caption,keep){
  const lt=(await ds.getLogicalTablesAsync()).find(t=>t.caption===caption);if(!lt)throw {user:'Table source introuvable : '+caption};
  const r=await ds.getLogicalTableDataReaderAsync(lt.id,20000);const out=[];let ix=null;
  for(let i=0;i<r.pageCount;i++){const p=await r.getPageAsync(i);
    if(!ix){const names=p.columns.map(c=>c.fieldName);ix=keep.map(n=>names.indexOf(n));}
    p.data.forEach(row=>{const o={};keep.forEach((n,j)=>{const c=ix[j]>=0?row[ix[j]]:null;o[n]=c==null?null:(c.nativeValue!==undefined?c.nativeValue:c.value);});out.push(o);});}
  await r.releaseAsync();return out;}
async function loadRaw(worksheets){
  // on retrouve les sources via n'importe quelle feuille qui les utilise
  const found={};
  for(const ws of worksheets){if(found.EG&&found.EQ)break;let dss=[];try{dss=await ws.getDataSourcesAsync();}catch(e){continue;}
    dss.forEach(d=>{if(d.name==='Encartage_Groupe'&&!found.EG)found.EG=d;if(d.name==='EQC'&&!found.EQ)found.EQ=d;});}
  if(!found.EG||!found.EQ)throw {user:'Sources Encartage_Groupe / EQC introuvables'};
  const [EG,EQ]=await Promise.all([readLogical(found.EG,'Encartage_Groupe',HCOLS.EG),readLogical(found.EQ,'EQC',HCOLS.EQ)]);
  return {EG,EQ};}
const TEMPO_RAW={Hebdo:'S',Mensuel:'M',CAD:'CAD S',CAM:'CAM S'},CORA_RAW={Exclu:'0',Inclus:'1','New Carrefour':'2'};
const ENS_RAW={Groupe:'Groupe',Hyper:'1- HYPER',Market:'2- MARKET',Proxi:'3- PROXI','E-commerce':'E-com'};
function buildHist(){if(TB)return histFromTables();
  if(!RAW)return null;const F=FILT,tp=TEMPO_RAW[F.tempo],cora=CORA_RAW[F.nc],st=F.stat,enc=F.enc==='PASS'?'PASS':'Encarté';
  const ok=r=>r.Temporalite===tp&&String(r['Flag cora'])===cora&&r.statut_desc===st;
  const per={};const P=id=>(per[id]=per[id]||{id,key:perKey(id),f:{}});
  RAW.EG.filter(ok).forEach(r=>{const e=fmtName(r.Enseigne)||r.Enseigne,o=(P(r.Identifiant).f[e]=P(r.Identifiant).f[e]||{}),fl=r['Flag clients'];
    const tag=fl===enc?'e':fl==='Groupe'?'g':fl==='Non Encarté'?'ne':null;if(!tag)return;
    o['ca_'+tag]=r['CA total N'];o['ca_'+tag+'_n1']=r['CA total N1'];o['db_'+tag]=r['Debit N'];o['db_'+tag+'_n1']=r['Debit N1'];
    if(tag==='e'){if(r.obj_PoidsCAEncarte!=null)o.obj_ca=r.obj_PoidsCAEncarte;if(r.obj_PoidsDebitsEncartes!=null)o.obj_db=r.obj_PoidsDebitsEncartes;}});
  const eqE=ENS_RAW[F.eqc]||'Groupe';
  RAW.EQ.filter(r=>ok(r)&&r.Enseigne===eqE).forEach(r=>{const fl=r['Flag clients'];if(fl!==enc&&fl!=='Non Encarté')return;const t=fl===enc?'e':'ne';const q=(P(r.Identifiant).q=P(r.Identifiant).q||{});
    [['clients','nb clients N'],['freq','Freq N'],['panier','Panier Moyen N'],['depense','Depense M N'],['prix','Prix moyen N'],['articles','Article moyen N']].forEach(([k,c])=>{q[k+'_'+t]=r[c];q[k+'_'+t+'_n1']=r[c.replace(/ N$/,' N1')];});});
  const rows=Object.values(per).filter(p=>p.key).sort((a,b)=>a.key<b.key?-1:1).map(p=>{const out={id:p.id,key:p.key,label:perLab(p.key,F.tempo),fmt:{}};
    Object.entries(p.f).forEach(([e,o])=>{const x={poids_ca:o.ca_g?o.ca_e/o.ca_g:null,poids_ca_n1:o.ca_g_n1?o.ca_e_n1/o.ca_g_n1:null,poids_db:o.db_g?o.db_e/o.db_g:null,poids_db_n1:o.db_g_n1?o.db_e_n1/o.db_g_n1:null,
      ev_ca_e:o.ca_e_n1?o.ca_e/o.ca_e_n1-1:null,ev_ca_ne:o.ca_ne_n1?o.ca_ne/o.ca_ne_n1-1:null,ev_db_e:o.db_e_n1?o.db_e/o.db_e_n1-1:null,ca_e:o.ca_e,db_e:o.db_e};
      x.obj_ca=o.obj_ca!=null&&x.poids_ca_n1!=null?x.poids_ca_n1+o.obj_ca:null;x.obj_db=o.obj_db!=null&&x.poids_db_n1!=null?x.poids_db_n1+o.obj_db:null;out.fmt[e]=x;});
    const q=p.q||{};out.q=q;['clients','freq','panier','depense','prix','articles'].forEach(k=>{out['ev_'+k]=q[k+'_e_n1']?q[k+'_e']/q[k+'_e_n1']-1:null;});return out;});
  return {rows,tempo:F.tempo,scope:M.scope||'',n:rows.length};}
/* --- lecture analytique des séries (règles simples, aucun chiffre inventé) --- */
function histInsights(H){const G=H.rows.map(r=>r.fmt.Groupe||{}),L=H.rows.length;if(L<2)return [];const out=[];const last=G[L-1],prev=G[L-2];
  const take=k=>G.map(g=>g[k]).filter(v=>v!=null);
  const db=take('poids_db');if(db.length>1){const w=Math.min(8,db.length-1),d=db[db.length-1]-db[db.length-1-w];out.push(['Poids Débit encartés',`${pct(last.poids_db,1)} sur la dernière période, ${d>=0?'en hausse':'en baisse'} de ${pts(Math.abs(d))} sur les ${w} dernières périodes.`,d>=0?'ok':'vig']);}
  const gap=G.map((g,i)=>g.obj_db!=null&&g.poids_db!=null?{i,v:g.poids_db-g.obj_db}:null).filter(Boolean);
  if(gap.length){const under=gap.filter(x=>x.v<0).length;out.push(['Objectif de poids Débit',`${under} période${under>1?'s':''} sur ${gap.length} sous l’objectif ; écart actuel ${pts(gap[gap.length-1].v)}.`,gap[gap.length-1].v<0?'alert':'ok']);}
  const ev=take('ev_ca_e'),evn=take('ev_ca_ne');if(ev.length){const best=G.reduce((b,g,i)=>g.ev_ca_e!=null&&(b<0||g.ev_ca_e>G[b].ev_ca_e)?i:b,-1),worst=G.reduce((b,g,i)=>g.ev_ca_e!=null&&(b<0||g.ev_ca_e<G[b].ev_ca_e)?i:b,-1);
    const ahead=G.filter(g=>g.ev_ca_e!=null&&g.ev_ca_ne!=null&&g.ev_ca_e>g.ev_ca_ne).length;
    out.push(['CA des encartés vs N-1',`Meilleure période : ${H.rows[best].label} (${evo(G[best].ev_ca_e)}) ; plus faible : ${H.rows[worst].label} (${evo(G[worst].ev_ca_e)}). Les encartés font mieux que les non-encartés sur ${ahead} période${ahead>1?'s':''} sur ${ev.length}.`,'opp']);}
  const fq=H.rows.map(r=>r.ev_freq).filter(v=>v!=null),pa=H.rows.map(r=>r.ev_panier).filter(v=>v!=null);
  if(fq.length&&pa.length){const fpos=fq.filter(v=>v>0).length,pneg=pa.filter(v=>v<0).length;out.push(['Équation commerciale',`Fréquence en hausse vs N-1 sur ${fpos}/${fq.length} périodes, panier en baisse sur ${pneg}/${pa.length}.`,pneg>pa.length/2?'vig':'ok']);}
  return out;}

function hLine(rows,series,o={}){

async function readWS(ws){

  const rows=t.data.map(r=>r.map(c=>{const v=c==null?null:(c.nativeValue!==undefined?c.nativeValue:c.value);return v==='%null%'||v===''?null:v;}));
  const idx=n=>cols.map((c,i)=>c===n?i:-1).filter(i=>i>=0);
  const get=(row,...names)=>{for(const n of names)for(const i of idx(n.toLowerCase())){const v=row[i];if(v!=null&&v!=='')return v;}return null;};
